name: Build Android Linux storage and Vulkan frame APK

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'Build ARM64 emulator runtime (experimental)'
      - 'Build independent Android X11 engine'
    types: [completed]
  push:
    branches: [main, fix/v0129-gpu-diagnostics]
    paths:
      - 'app/**'
      - 'native/vortek/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
      - 'scripts/verify-native-runtime.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: android-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pull only a successful, integrity-verified native package. The APK is
      # self-contained; users do not need to copy GitHub ZIPs onto Android.
      - name: Find successful native runtime build
        id: native_run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" && \
                "${{ github.event.workflow_run.name }}" == "Build ARM64 emulator runtime (experimental)" ]]; then
            run_id="${{ github.event.workflow_run.id }}"
          else
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/native-runtime.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id')"
          fi
          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            echo "No successful native runtime available" >&2
            exit 1
          fi
          echo "id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using native runtime from GitHub Actions run $run_id"

      - name: Download verified Linux ARM64 runtime
        uses: actions/download-artifact@v4
        with:
          name: rb4dx-arm64-linux-runtime
          run-id: ${{ steps.native_run.outputs.id }}
          github-token: ${{ github.token }}
          path: native-runtime-artifact

      - name: Verify and stage runtime assets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-native-runtime.py \
            native-runtime-artifact/runtime.zip \
            native-runtime-artifact/manifest.json
          mkdir -p app/src/main/assets/runtime
          cp native-runtime-artifact/runtime.zip app/src/main/assets/runtime/runtime.zip
          cp native-runtime-artifact/manifest.json app/src/main/assets/runtime/manifest.json

      # Android prevents executing ELF binaries extracted to writable app
      # storage. Package the glibc ARM64 loader as a native library so the
      # package manager places it in the app's protected nativeLibraryDir.
      - name: Stage ARM64 host loader for execution probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          unzip -p native-runtime-artifact/runtime.zip \
            host/ld-linux-aarch64.so.1 \
            > app/src/main/jniLibs/arm64-v8a/librb4dx_host_loader.so
          test -s app/src/main/jniLibs/arm64-v8a/librb4dx_host_loader.so
          readelf -h app/src/main/jniLibs/arm64-v8a/librb4dx_host_loader.so |
            grep -Eq 'Machine:.*AArch64'

      - name: Find successful independent X11 server build
        id: x11_run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" && \
                "${{ github.event.workflow_run.name }}" == "Build independent Android X11 engine" ]]; then
            run_id="${{ github.event.workflow_run.id }}"
          else
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/display-runtime.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id')"
          fi
          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            echo 'No verified Android X11 server build yet' >&2
            exit 1
          fi
          echo "id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download independent native X11 server
        uses: actions/download-artifact@v4
        with:
          name: rb4dx-android-x11-native-stage
          run-id: ${{ steps.x11_run.outputs.id }}
          github-token: ${{ github.token }}
          path: x11-native-artifact

      - name: Package native X11 server executable into APK
        shell: bash
        run: |
          set -euo pipefail
          test -s x11-native-artifact/rb4dx-x11-server-arm64
          cp x11-native-artifact/rb4dx-x11-server-arm64 \
            app/src/main/jniLibs/arm64-v8a/librb4dx_x11_server.so
          readelf -h app/src/main/jniLibs/arm64-v8a/librb4dx_x11_server.so |
            grep -Eq 'Machine:.*AArch64'

      - name: Compile read-only Linux ARM64 glibc game probe
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v aarch64-linux-gnu-gcc >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gcc-aarch64-linux-gnu
          fi
          aarch64-linux-gnu-gcc -O2 -Wall -Wextra -Werror -fPIE -pie \
            native/glibc_file_probe.c \
            -o app/src/main/jniLibs/arm64-v8a/librb4dx_glibc_fileprobe.so
          readelf -h app/src/main/jniLibs/arm64-v8a/librb4dx_glibc_fileprobe.so |
            grep -Eq 'Machine:.*AArch64'

      - name: Compile app-private X11 socket client bridge
        shell: bash
        run: |
          set -euo pipefail
          # The embedded X11 server uses an app-private Unix socket, while
          # the glibc SDL client expects /tmp/.X11-unix. Redirect connect(2)
          # for the current display only.
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Werror -fPIC -shared \
            native/glibc_x11_socket_redirect.c \
            -o app/src/main/jniLibs/arm64-v8a/librb4dx_x11_redirect.so
          readelf -h app/src/main/jniLibs/arm64-v8a/librb4dx_x11_redirect.so |
            grep -Eq 'Machine:.*AArch64'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.3.11579264' 'cmake;3.22.1'
      # Use pinned, source-built Android Vortek server components. The existing
      # glibc guest ICD is a client and is insufficient without this endpoint.
      - name: Build standalone Android Vulkan IPC server
        shell: bash
        run: |
          set -euo pipefail
          winlator_src="$RUNNER_TEMP/rb4dx-winlator"
          server_src="$RUNNER_TEMP/rb4dx-vortek-server"
          build_dir="$RUNNER_TEMP/rb4dx-vortek-build"
          winlator_rev=72ec347c9ced676e206fbc3762b9d567852cb3e3
          server_rev=df8183df5c2b024f116a5f796a9e4147aa696cd0
          git init -q "$winlator_src"
          git -C "$winlator_src" remote add origin https://github.com/JICA98/winlator-app.git
          git -C "$winlator_src" fetch -q --depth 1 --filter=blob:none origin "$winlator_rev"
          git -C "$winlator_src" sparse-checkout init --cone
          git -C "$winlator_src" sparse-checkout set app/src/main/cpp/winlator app/src/main/cpp/libadrenotools
          git -C "$winlator_src" checkout -q --detach FETCH_HEAD
          test "$(git -C "$winlator_src" rev-parse HEAD)" = "$winlator_rev"
          git init -q "$server_src"
          git -C "$server_src" remote add origin https://github.com/JICA98/vortek.git
          git -C "$server_src" fetch -q --depth 1 --filter=blob:none origin "$server_rev"
          git -C "$server_src" checkout -q --detach FETCH_HEAD
          test "$(git -C "$server_src" rev-parse HEAD)" = "$server_rev"
          cmake -S native/vortek -B "$build_dir" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/26.3.11579264/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-31 -DWINLATOR_SOURCE="$winlator_src" -DVORTEK_SERVER_SOURCE="$server_src"
          cmake --build "$build_dir" --target winlator vortekrenderer rb4dx_vortek_bridge hook_impl main_hook --parallel 4
          install -m 0755 "$(find "$build_dir" -name libwinlator.so -print -quit)" app/src/main/jniLibs/arm64-v8a/libwinlator.so
          install -m 0755 "$(find "$build_dir" -name libvortekrenderer.so -print -quit)" app/src/main/jniLibs/arm64-v8a/libvortekrenderer.so
          install -m 0755 "$(find "$build_dir" -name librb4dx_vortek_bridge.so -print -quit)" app/src/main/jniLibs/arm64-v8a/librb4dx_vortek_bridge.so
          # The custom Turnip loader uses AdrenoTools hooks inside a Vulkan namespace.
          # Without these two libraries it silently returns no Vulkan entrypoints.
          install -m 0755 "$(find "$build_dir" -name libhook_impl.so -print -quit)" app/src/main/jniLibs/arm64-v8a/libhook_impl.so
          install -m 0755 "$(find "$build_dir" -name libmain_hook.so -print -quit)" app/src/main/jniLibs/arm64-v8a/libmain_hook.so
          for lib in libwinlator.so libvortekrenderer.so librb4dx_vortek_bridge.so libhook_impl.so libmain_hook.so; do
            readelf -h "app/src/main/jniLibs/arm64-v8a/$lib" | grep -Eq 'Machine:.*AArch64'
          done
      # Mesa Turnip is bundled in the APK's nativeLibraryDir, not extracted
      # at runtime into writable app storage (blocked for target SDK 29+).
      # Keep the release URL and digest pinned: never silently pull latest.
      - name: Bundle pinned ARM64 Mesa Turnip GPU driver (optional backend)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          turnip_release=v27.0.0-20261105-r5
          turnip_asset=Turnip-v27.0.0-20261105-r5.zip
          turnip_sha256=0e00f9a85105d0df992858728d01dd9398df9eae478d27da35df3ce7690d4908
          archive_dir="$RUNNER_TEMP/rb4dx-pinned-turnip"
          mkdir -p "$archive_dir"
          gh release download "$turnip_release" \
            --repo The412Banner/Banners-Turnip \
            --pattern "$turnip_asset" --dir "$archive_dir"
          archive="$archive_dir/$turnip_asset"
          echo "$turnip_sha256  $archive" | sha256sum --check --status
          mapfile -t driver_entries < <(unzip -Z1 "$archive" | grep -E '(^|/)libvulkan_freedreno\.so$')
          if [[ "${#driver_entries[@]}" -ne 1 ]]; then
            echo "Expected exactly one libvulkan_freedreno.so in pinned Turnip ZIP" >&2
            exit 1
          fi
          unzip -p "$archive" "${driver_entries[0]}" \
            > app/src/main/jniLibs/arm64-v8a/libvulkan_freedreno.so
          test -s app/src/main/jniLibs/arm64-v8a/libvulkan_freedreno.so
          readelf -h app/src/main/jniLibs/arm64-v8a/libvulkan_freedreno.so |
            grep -Eq 'Machine:.*AArch64'
      # Android's implicit debug.keystore lives in an unpredictable location
      # on these hosted runners. Use a clearly scoped key generated once in a
      # known path, and reuse it for subsequent versions of this test package.
      - name: Cache test-only Android signing key
        uses: actions/cache@v4
        with:
          path: .ci-signing/rb4dx-test.keystore
          key: rb4dx-ci-linuxvk-signing-v1
      - name: Create test-only signing key on first build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-signing
          if [[ ! -s .ci-signing/rb4dx-test.keystore ]]; then
            keytool -genkeypair -noprompt -storetype PKCS12 \
              -keystore .ci-signing/rb4dx-test.keystore \
              -storepass android -keypass android -alias rb4dx-test \
              -keyalg RSA -keysize 3072 -validity 3650 \
              -dname 'CN=RB4DX Independent Android Test, OU=Debug, O=RB4DX, C=CA'
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run JVM and runtime-verifier regression tests
        run: bash tests/run.sh
      - run: gradle :app:assembleDebug --no-daemon
      - name: Verify native startup and Vulkan libraries are packaged
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" |
            grep -F "package: name='dev.rb4dx.standalone.linuxvk.turnip' versionCode='15' versionName='0.12.9-gpu-diagnostics'"
          unzip -Z -1 "$apk" | grep -Fx 'assets/runtime/runtime.zip'
          for name in librb4dx_host_loader.so librb4dx_x11_server.so \
              librb4dx_x11_redirect.so libwinlator.so libvortekrenderer.so \
              librb4dx_vortek_bridge.so libvulkan_freedreno.so \
              libhook_impl.so libmain_hook.so; do
            unzip -Z -1 "$apk" | grep -Fx "lib/arm64-v8a/$name"
          done
          sha256sum "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: rb4dx-x11-window-startup-debug
          path: app/build/outputs/apk/debug/*.apk
