name: Build Android Linux storage and Vulkan frame APK

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'Build ARM64 emulator runtime (experimental)'
      - 'Build independent Android X11 engine'
    types: [completed]
  push:
    branches: [main, fix/v0129-gpu-diagnostics, fix/v0130-feedback-loop-dispatch, feature/v0131-live-frame-queue, feature/v01212-preview-failure-diagnostics, feature/v01213-gpu-wait-trace, feature/v01214-live-surface-heartbeat, feature/v01215-controller-input, feature/v01216-extended-startup, feature/v01217-evidence-preservation, feature/v01218-high-signal-logs, feature/v01219-gpu-wait-backoff, feature/v01220-live-surface-transport, feature/v01222-shader-compat]
    paths:
      - 'app/**'
      - 'native/vortek/**'
      - 'native/patches/**'
      - 'tests/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
      - 'scripts/verify-native-runtime.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: android-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pull only a successful, integrity-verified native package. The APK is
      # self-contained; users do not need to copy GitHub ZIPs onto Android.
      - name: Find successful native runtime build
        id: native_run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" && \
                "${{ github.event.workflow_run.name }}" == "Build ARM64 emulator runtime (experimental)" ]]; then
            run_id="${{ github.event.workflow_run.id }}"
          elif [[ "$GITHUB_REF_NAME" == "feature/v01222-shader-compat" ]]; then
            # Android-only v0.12.23 changes reuse the exact verified v0.12.22
            # patched ARM64 runtime. It is NOT an unpinned latest-success run.
            run_id="42241434598"
          elif [[ "$GITHUB_REF_NAME" == "feature/v01219-gpu-wait-backoff" || \
                  "$GITHUB_REF_NAME" == "feature/v01220-live-surface-transport" ]]; then
            # The only native build with the bounded GPU-wait scheduler change.
            run_id="42209460284"
          elif [[ "$GITHUB_REF_NAME" == "feature/v01214-live-surface-heartbeat" || \
                  "$GITHUB_REF_NAME" == "feature/v01215-controller-input" || \
                  "$GITHUB_REF_NAME" == "feature/v01216-extended-startup" || \
                  "$GITHUB_REF_NAME" == "feature/v01217-evidence-preservation" || \
                  "$GITHUB_REF_NAME" == "feature/v01218-high-signal-logs" ]]; then
            # Use the exact already-verified v0.12.13 runtime, not a mutable latest-success.
            run_id="42119601182"
          elif [[ "$GITHUB_REF_NAME" == "feature/v01213-gpu-wait-trace" ]]; then
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/native-runtime.yml/runs?status=success&branch=feature/v01213-gpu-wait-trace&per_page=1" --jq '.workflow_runs[0].id')"
          elif [[ "$GITHUB_REF_NAME" == "fix/v0130-feedback-loop-dispatch" || \
                  "$GITHUB_REF_NAME" == "feature/v0131-live-frame-queue" || \
                  "$GITHUB_REF_NAME" == "feature/v01212-preview-failure-diagnostics" ]]; then
            # Reuse the known-good guest runtime with the feedback-loop guard.
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/native-runtime.yml/runs?status=success&branch=fix/v0130-feedback-loop-dispatch&per_page=1" --jq '.workflow_runs[0].id')"
          else
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/native-runtime.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id')"
          fi
          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            echo "No successful native runtime available" >&2
            exit 1
          fi
          native_branch="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.head_branch')"
          if [[ "$GITHUB_REF_NAME" == "feature/v01222-shader-compat" ]]; then
            native_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.head_sha')"
            native_conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.conclusion')"
            if [[ "$native_branch" != "feature/v01222-shader-compat" || \
                  "$native_sha" != "c7232ec3548c5a1ce3e1a71f5122f7e5220ba14a" || \
                  "$native_conclusion" != "success" ]]; then
              echo "v0.12.23 requires the verified v0.12.22 native runtime" >&2
              exit 1
            fi
          fi
          if [[ ( "$GITHUB_REF_NAME" == "feature/v01213-gpu-wait-trace" || \
                  "$GITHUB_REF_NAME" == "feature/v01214-live-surface-heartbeat" || \
                  "$GITHUB_REF_NAME" == "feature/v01215-controller-input" || \
                  "$GITHUB_REF_NAME" == "feature/v01216-extended-startup" || \
                  "$GITHUB_REF_NAME" == "feature/v01217-evidence-preservation" || \
                  "$GITHUB_REF_NAME" == "feature/v01218-high-signal-logs" ) && \
                "$native_branch" != "feature/v01213-gpu-wait-trace" ]]; then
            echo "Refusing non-diagnostic native runtime: $native_branch" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" == "feature/v01214-live-surface-heartbeat" || \
                "$GITHUB_REF_NAME" == "feature/v01215-controller-input" || \
                "$GITHUB_REF_NAME" == "feature/v01216-extended-startup" || \
                "$GITHUB_REF_NAME" == "feature/v01217-evidence-preservation" || \
                "$GITHUB_REF_NAME" == "feature/v01218-high-signal-logs" ]]; then
            native_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.head_sha')"
            native_conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.conclusion')"
            if [[ "$native_sha" != "18bbb0bc0c914f86816513cf4d10b99178984524" || \
                  "$native_conclusion" != "success" ]]; then
              echo "Refusing altered or unsuccessful v0.12.13 runtime $run_id" >&2
              exit 1
            fi
          fi
          if [[ "$GITHUB_REF_NAME" == "feature/v01219-gpu-wait-backoff" || \
                "$GITHUB_REF_NAME" == "feature/v01220-live-surface-transport" ]]; then
            native_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.head_sha')"
            native_conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.conclusion')"
            if [[ "$native_branch" != "feature/v01219-gpu-wait-backoff" || \
                  "$native_sha" != "7e27c0634c1b0bb0bd42397629bd10d3676adb01" || \
                  "$native_conclusion" != "success" ]]; then
              echo "Refusing unverified GPU-wait-backoff runtime $run_id" >&2
              exit 1
            fi
          fi
          if [[ ( "$GITHUB_REF_NAME" == "fix/v0130-feedback-loop-dispatch" || \
                  "$GITHUB_REF_NAME" == "feature/v0131-live-frame-queue" || \
                  "$GITHUB_REF_NAME" == "feature/v01212-preview-failure-diagnostics" ) && \
                "$native_branch" != "fix/v0130-feedback-loop-dispatch" ]]; then
            echo "Refusing native runtime from another branch: $native_branch" >&2
            exit 1
          fi
          echo "id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using native runtime from GitHub Actions run $run_id (branch $native_branch)"

      - name: Download verified Linux ARM64 runtime
        uses: actions/download-artifact@v4
        with:
          name: rb4dx-arm64-linux-runtime
          run-id: ${{ steps.native_run.outputs.id }}
          github-token: ${{ github.token }}
          path: native-runtime-artifact

      - name: Verify and stage runtime assets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-native-runtime.py \
            native-runtime-artifact/runtime.zip \
            native-runtime-artifact/manifest.json
          mkdir -p app/src/main/assets/runtime
          cp native-runtime-artifact/runtime.zip app/src/main/assets/runtime/runtime.zip
          cp native-runtime-artifact/manifest.json app/src/main/assets/runtime/manifest.json

      # Android prevents executing ELF binaries extracted to writable app
      # storage. Package the glibc ARM64 loader as a native library so the
      # package manager places it in the app's protected nativeLibraryDir.
      - name: Stage ARM64 host loader for execution probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          unzip -p native-runtime-artifact/runtime.zip \
            host/ld-linux-aarch64.so.1 \
            > app/src/main/jniLibs/arm64-v8a/librb4dx_host_loader.so
          test -s app/src/main/jniLibs/arm64-v8a/librb4dx_host_loader.so
          readelf -h app/src/main/jniLibs/arm64-v8a/librb4dx_host_loader.so |
            grep -Eq 'Machine:.*AArch64'

      - name: Find successful independent X11 server build
        id: x11_run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" && \
                "${{ github.event.workflow_run.name }}" == "Build independent Android X11 engine" ]]; then
            run_id="${{ github.event.workflow_run.id }}"
          else
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/display-runtime.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id')"
          fi
          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            echo 'No verified Android X11 server build yet' >&2
            exit 1
          fi
          echo "id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download independent native X11 server
        uses: actions/download-artifact@v4
        with:
          name: rb4dx-android-x11-native-stage
          run-id: ${{ steps.x11_run.outputs.id }}
          github-token: ${{ github.token }}
          path: x11-native-artifact

      - name: Package native X11 server executable into APK
        shell: bash
        run: |
          set -euo pipefail
          test -s x11-native-artifact/rb4dx-x11-server-arm64
          cp x11-native-artifact/rb4dx-x11-server-arm64 \
            app/src/main/jniLibs/arm64-v8a/librb4dx_x11_server.so
          readelf -h app/src/main/jniLibs/arm64-v8a/librb4dx_x11_server.so |
            grep -Eq 'Machine:.*AArch64'

      # These two unchanged source files were already compiled successfully in
      # v0.12.14. Reuse that exact APK's ARM64 helpers instead of depending on
      # apt mirrors to install a cross compiler on each GitHub runner.
      - name: Verify successful pinned v0.12.14 helper source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            b4b85d52d9d325cc14de0654e977d42d22e1662885af2cd4de2fc9b7c96db11b native/glibc_file_probe.c \
            c53afbb0d6b4f1cffd2e58fa9b17577679799c707e0dcdcf28d2463547027c32 native/glibc_x11_socket_redirect.c |
            sha256sum -c -
          run_id=42126146668
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.head_sha')"
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.conclusion')"
          if [[ "$sha" != a3bc456162219d5b44f2903c1ed167ff95b3733c ||
                "$conclusion" != success ]]; then
            echo 'Refusing changed or unsuccessful prior helper APK' >&2
            exit 1
          fi

      - name: Download verified ARM64 game and X11 probes
        uses: actions/download-artifact@v4
        with:
          name: rb4dx-live-heartbeat-debug
          run-id: 42126146668
          github-token: ${{ github.token }}
          path: pinned-helper-apk

      - name: Stage already-compiled ARM64 probes
        shell: bash
        run: |
          set -euo pipefail
          previous_apk=pinned-helper-apk/app-debug.apk
          test -s "$previous_apk"
          unzip -t "$previous_apk" >/dev/null
          for name in librb4dx_glibc_fileprobe.so librb4dx_x11_redirect.so; do
            unzip -p "$previous_apk" "lib/arm64-v8a/$name" \
              > "app/src/main/jniLibs/arm64-v8a/$name"
            test -s "app/src/main/jniLibs/arm64-v8a/$name"
            readelf -h "app/src/main/jniLibs/arm64-v8a/$name" |
              grep -Eq 'Machine:.*AArch64'
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.3.11579264' 'cmake;3.22.1'
      # Use pinned, source-built Android Vortek server components. The existing
      # glibc guest ICD is a client and is insufficient without this endpoint.
      - name: Build standalone Android Vulkan IPC server
        shell: bash
        run: |
          set -euo pipefail
          winlator_src="$RUNNER_TEMP/rb4dx-winlator"
          server_src="$RUNNER_TEMP/rb4dx-vortek-server"
          build_dir="$RUNNER_TEMP/rb4dx-vortek-build"
          winlator_rev=72ec347c9ced676e206fbc3762b9d567852cb3e3
          server_rev=df8183df5c2b024f116a5f796a9e4147aa696cd0
          git init -q "$winlator_src"
          git -C "$winlator_src" remote add origin https://github.com/JICA98/winlator-app.git
          git -C "$winlator_src" fetch -q --depth 1 --filter=blob:none origin "$winlator_rev"
          git -C "$winlator_src" sparse-checkout init --cone
          git -C "$winlator_src" sparse-checkout set app/src/main/cpp/winlator app/src/main/cpp/libadrenotools
          git -C "$winlator_src" checkout -q --detach FETCH_HEAD
          test "$(git -C "$winlator_src" rev-parse HEAD)" = "$winlator_rev"
          git init -q "$server_src"
          git -C "$server_src" remote add origin https://github.com/JICA98/vortek.git
          git -C "$server_src" fetch -q --depth 1 --filter=blob:none origin "$server_rev"
          git -C "$server_src" checkout -q --detach FETCH_HEAD
          test "$(git -C "$server_src" rev-parse HEAD)" = "$server_rev"
          # Carry per-swapchain-image identity through the pinned Vortek JNI
          # callbacks. Fail loudly if upstream source changes under the pin.
          git -C "$server_src" apply --check "$GITHUB_WORKSPACE/native/patches/rb4dx-vortek-frame-index.patch"
          git -C "$server_src" apply "$GITHUB_WORKSPACE/native/patches/rb4dx-vortek-frame-index.patch"
          cmake -S native/vortek -B "$build_dir" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/26.3.11579264/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-31 -DWINLATOR_SOURCE="$winlator_src" -DVORTEK_SERVER_SOURCE="$server_src"
          cmake --build "$build_dir" --target winlator vortekrenderer rb4dx_vortek_bridge hook_impl main_hook --parallel 4
          install -m 0755 "$(find "$build_dir" -name libwinlator.so -print -quit)" app/src/main/jniLibs/arm64-v8a/libwinlator.so
          install -m 0755 "$(find "$build_dir" -name libvortekrenderer.so -print -quit)" app/src/main/jniLibs/arm64-v8a/libvortekrenderer.so
          install -m 0755 "$(find "$build_dir" -name librb4dx_vortek_bridge.so -print -quit)" app/src/main/jniLibs/arm64-v8a/librb4dx_vortek_bridge.so
          # The custom Turnip loader uses AdrenoTools hooks inside a Vulkan namespace.
          # Without these two libraries it silently returns no Vulkan entrypoints.
          install -m 0755 "$(find "$build_dir" -name libhook_impl.so -print -quit)" app/src/main/jniLibs/arm64-v8a/libhook_impl.so
          install -m 0755 "$(find "$build_dir" -name libmain_hook.so -print -quit)" app/src/main/jniLibs/arm64-v8a/libmain_hook.so
          for lib in libwinlator.so libvortekrenderer.so librb4dx_vortek_bridge.so libhook_impl.so libmain_hook.so; do
            readelf -h "app/src/main/jniLibs/arm64-v8a/$lib" | grep -Eq 'Machine:.*AArch64'
          done
      # Mesa Turnip is bundled in the APK's nativeLibraryDir, not extracted
      # at runtime into writable app storage (blocked for target SDK 29+).
      # Keep the release URL and digest pinned: never silently pull latest.
      - name: Bundle pinned ARM64 Mesa Turnip GPU driver (optional backend)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          turnip_release=v27.0.0-20261105-r5
          turnip_asset=Turnip-v27.0.0-20261105-r5.zip
          turnip_sha256=0e00f9a85105d0df992858728d01dd9398df9eae478d27da35df3ce7690d4908
          archive_dir="$RUNNER_TEMP/rb4dx-pinned-turnip"
          mkdir -p "$archive_dir"
          gh release download "$turnip_release" \
            --repo The412Banner/Banners-Turnip \
            --pattern "$turnip_asset" --dir "$archive_dir"
          archive="$archive_dir/$turnip_asset"
          echo "$turnip_sha256  $archive" | sha256sum --check --status
          mapfile -t driver_entries < <(unzip -Z1 "$archive" | grep -E '(^|/)libvulkan_freedreno\.so$')
          if [[ "${#driver_entries[@]}" -ne 1 ]]; then
            echo "Expected exactly one libvulkan_freedreno.so in pinned Turnip ZIP" >&2
            exit 1
          fi
          unzip -p "$archive" "${driver_entries[0]}" \
            > app/src/main/jniLibs/arm64-v8a/libvulkan_freedreno.so
          test -s app/src/main/jniLibs/arm64-v8a/libvulkan_freedreno.so
          readelf -h app/src/main/jniLibs/arm64-v8a/libvulkan_freedreno.so |
            grep -Eq 'Machine:.*AArch64'
      # Independent comparison option, not a replacement for the existing
      # pinned v27 driver. Bachata's glibc 26.1.0 emulator ZIP is NOT usable
      # in this Android/Bionic Vulkan server; the v26.3.0-R5 ZIP is Bionic.
      - name: Bundle verified Bachata Bionic-compatible Turnip driver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rb4dx-bachata-driver" app/src/main/assets/licenses
          gh release download v0.2.5 \
            --repo JICA98/Bachata-S4 \
            --pattern bachatas4-0.2.5-release.apk \
            --dir "$RUNNER_TEMP/rb4dx-bachata-driver"
          python3 scripts/extract-bachata-bionic-driver.py \
            "$RUNNER_TEMP/rb4dx-bachata-driver/bachatas4-0.2.5-release.apk" \
            1df49463f396df8b6f042230bdc1bb9f948b8e69894c378915920875c40ab0ee \
            app/src/main/jniLibs/arm64-v8a/libvulkan_freedreno_compat.so \
            app/src/main/assets/licenses/mesa-turnip-26.3.0-r5-NOTICE.txt
          readelf -h app/src/main/jniLibs/arm64-v8a/libvulkan_freedreno_compat.so |
            grep -Eq 'Machine:.*AArch64'
      # Android's implicit debug.keystore lives in an unpredictable location
      # on these hosted runners. Use a clearly scoped key generated once in a
      # known path, and reuse it for subsequent versions of this test package.
      - name: Cache test-only Android signing key
        uses: actions/cache@v4
        with:
          path: .ci-signing/rb4dx-test.keystore
          key: rb4dx-ci-linuxvk-signing-v1
      - name: Create test-only signing key on first build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-signing
          if [[ ! -s .ci-signing/rb4dx-test.keystore ]]; then
            keytool -genkeypair -noprompt -storetype PKCS12 \
              -keystore .ci-signing/rb4dx-test.keystore \
              -storepass android -keypass android -alias rb4dx-test \
              -keyalg RSA -keysize 3072 -validity 3650 \
              -dname 'CN=RB4DX Independent Android Test, OU=Debug, O=RB4DX, C=CA'
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run JVM and runtime-verifier regression tests
        run: bash tests/run.sh
      - run: gradle :app:assembleDebug --no-daemon
      - name: Verify native startup and Vulkan libraries are packaged
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" |
            grep -F "package: name='dev.rb4dx.standalone.linuxvk.turnip.inputbridge' versionCode='29' versionName='0.12.23-bachata-parity'"
          unzip -Z -1 "$apk" | grep -Fx 'assets/runtime/runtime.zip'
          for name in librb4dx_host_loader.so librb4dx_x11_server.so \
              librb4dx_x11_redirect.so libwinlator.so libvortekrenderer.so \
              librb4dx_vortek_bridge.so libvulkan_freedreno.so libvulkan_freedreno_compat.so \
              libhook_impl.so libmain_hook.so; do
            unzip -Z -1 "$apk" | grep -Fx "lib/arm64-v8a/$name"
          done
          sha256sum "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: rb4dx-bachata-parity-debug
          path: app/build/outputs/apk/debug/*.apk
